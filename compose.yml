services:
  dashboard:
    container_name: himalayan-drumming-dashboard
    build:
      dockerfile: ./docker/Dockerfile
      context: .
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./blob:/app/blob:rw
    ports:
      - 8080:80
  database:
    image: postgres:17-alpine
    container_name: himalayan-drumming-database
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 30s
      timeout: 10s
      interval: 10s
      retries: 5
volumes:
  pgdata:
