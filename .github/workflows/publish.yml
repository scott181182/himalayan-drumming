name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Frontend Metadata
        id: meta_frontend
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=semver,pattern={{version}}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          bake-target: docker-metadata-action-frontend
      - name: Extract Migrate Metadata
        id: meta_migrate
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=semver,pattern={{version}}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/db-migrate
          bake-target: docker-metadata-action-migrate

      - name: Build and Push Docker Images
        id: publish
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta_frontend.outputs.bake-file }}
            cwd://${{ steps.meta_migrate.outputs.bake-file }}
          targets: frontend,migrate
          push: true
