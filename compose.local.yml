services:
  frontend:
    image: ghcr.io/scott181182/himalayan-drumming/frontend:${TAG:-latest}
    container_name: himalayan-drumming-frontend
    build:
      context: .
      target: frontend
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SSR_API_HOST=http://backend:3001
    ports:
      - 3100:3000
  backend:
    image: ghcr.io/scott181182/himalayan-drumming/backend:${TAG:-latest}
    container_name: himalayan-drumming-backend
    build:
      context: .
      target: backend
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - BLOB_ROOT=/data/blob
    volumes:
      - ./blob:/data/blob:rw
    ports:
      - 3101:3001
  database:
    image: postgres:17-alpine
    container_name: himalayan-drumming-database
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      start_period: 30s
      timeout: 10s
      interval: 10s
      retries: 5
volumes:
  pgdata:
